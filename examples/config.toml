[base]
# HTTP服务器的监听端口
expose = 45678
# 可信反向代理的 IP/CIDR 列表；留空表示不信任任何代理头
trusted_proxies = []
# 即使未启用本地 TLS，也强制 Cookie 使用 Secure（TLS 在上游终止时开启）
secure_cookie = false

[base.cors]
# 允许的源地址，例如 ['https://example.com']
allow_origins = []
# 允许的请求方法，例如 ['GET', 'POST']
allow_methods = []
# 允许的请求头，例如 ['Content-Type', 'Authorization']
allow_headers = []
# 是否允许携带凭证信息
allow_credentials = false

[base.tls]
# 是否启用HTTPS。如果启用，将覆盖Expose端口，使用443端口
enabled = false
# 证书文件路径 (fullchain.cer)
# cert_file = ''
# 私钥文件路径
# key_file = ''
# HTTP明文端口，供内网服务访问（如DDNS）
http_port = 80

[aliyun]
# 实例运行的地域，例如 cn-hangzhou。地域将影响实例与OSS之间的内网连通性，不同地域之间抢占式实例的库存情况也有所不同。
# region_id = ''
# 用于访问阿里云服务的AKID，可在阿里云RAM控制台中生成
# access_key_id = ''
# 用于访问阿里云服务的AKSecret
# access_key_secret = ''

[aliyun.ecs]
# 实例的峰值带宽，单位为Mbps，取值范围1～100，必须为整数
internet_max_bandwidth_out = 5
# 实例使用的系统镜像名，决定操作系统类型
# image_id = ''
# 实例操作系统的主机名
hostname = 'aliyunmc-server'
# 实例操作系统根用户密码
# root_password = ''
# 实例操作系统主用户的密码
# prod_password = ''
# 实例的中止动作，取值Stop或Terminate
spot_interruption_behavior = 'Stop'
# 实例安全组ID
# security_group_id = ''

[aliyun.ecs.system_disk]
# 云盘类型
category = 'cloud_essd'
# 云盘大小，单位GiB（系统盘常见 40，数据盘常见 100）
# size = 0

[aliyun.ecs.data_disk]
# 云盘类型
category = 'cloud_essd'
# 云盘大小，单位GiB（系统盘常见 40，数据盘常见 100）
# size = 0

[server]
# MC服务器地址
port = 25565
# MC服务器的RCON服务地址，请务必保证server.properties中RCON已开启
rcon_port = 25575
# MC服务器的RCON密码，可在server.properties中设置和查看
# rcon_password = ''

[ssh]
# 控制器登录实例所用的私钥文件路径，必须是无口令私钥
# private_key_path = ''

[user_routes]
[user_routes.chat_token]
# JWT签名密钥
# secret = ''
# Token有效期（秒）
expire_seconds = 3600

[bot]
# 是否启用内网机器人接口；关闭时不注册 /bot-v1 路由
enabled = false
# 每分钟允许的请求数；0 表示不限制
rate_limit_per_minute = 120

[bot.api]
# 机器人 HTTP 接口端口；后端固定连接 127.0.0.1
port = 8081

[tasks]
[tasks.deploy]
# 部署脚本模板变量
[tasks.deploy.vars]
# 用于SSH访问的公钥
# ssh_access_public_key = ''
# JRE版本号，建议使用当前服务端要求的最低版本
java_version = 21
# 额外安装的软件包列表，例如 ['zip', 'unzip']
packages = []
# 用于部署恢复的OSS归档路径
# archive_oss_path = ''
# WSS证书文件路径（.p12格式），留空则跳过证书上传
# wss_cert_src = ''
# WSS证书在远程服务器上的目标路径，留空则跳过证书上传
# wss_cert_dst = ''

[tasks.backup]
# 任务超时时间（秒）
timeout_sec = 1800
# 是否同类互斥执行
exclusive = false

# 备份脚本模板变量
[tasks.backup.vars]
# 备份上传目标OSS目录
# backup_oss_path = ''
# 备份保留数量上限，超过后删除最旧的备份
max_keep_count = 5
# 需要备份的目录的公共父目录
base_dir = '/home/mc/server/archive'
# 需要备份的目录列表（相对于BaseDir），例如 ['world', 'world_nether', 'world_the_end']
target_dirs = []

[tasks.archive]
# 任务超时时间（秒）
timeout_sec = 600

# 归档脚本模板变量
[tasks.archive.vars]
# 归档OSS根路径
# oss_root = ''
# 归档目录名称
archive_name = 'archive'
# 位于远程服务器上的归档目录的绝对路径
remote_archive_dir = '/home/mc/server/archive'

[monitors]
[monitors.server]
# 服务器状态轮询间隔（秒）
poll_interval_sec = 5

[monitors.instance]
# 实例状态轮询间隔（秒）
poll_interval_sec = 5

[monitors.player_presence]
# 是否启用玩家进出服务器的群消息播报
enabled = false

[monitors.file_sync]
# 文件同步配置列表，每项形如 { remote_path = '...', local_path = '...', poll_interval_sec = 10 }
files = []
# 目录同步配置列表，每项形如 { remote_path = '...', local_path = '...', poll_interval_sec = 300 }
dirs = []

[monitors.auto_archive_idle]
# 是否启用空服自动归档回收监控
enabled = false
# 空服触发回收的倒计时（秒）
idle_countdown_sec = 1200
# 倒计时剩余多少秒时发送群提醒；0 表示关闭，必须小于 idle_countdown_sec
reminder_before_sec = 600
# 发送stop后等待离线的最长时间（秒）
stop_wait_timeout_sec = 60
# 等待离线时的状态检查间隔（秒）
offline_check_interval_sec = 3
# 删除active instance时是否忽略不存在错误
delete_ignore_non_existent = false

[monitors.backup]
# 是否启用自动备份监控
enabled = false
# 自动触发备份任务的轮询间隔（秒）
poll_interval_sec = 600

[monitors.spot_interruption]
# 是否启用抢占式实例回收监控
enabled = false
# 回收状态轮询间隔（秒）
poll_interval_sec = 30
# 发送stop后等待离线的最长时间（秒）
stop_wait_timeout_sec = 90
# 等待离线时的状态检查间隔（秒）
offline_check_interval_sec = 3

[monitors.best_ecs_candidate]
# 最佳ECS候选监控的轮询间隔（秒）
poll_interval_sec = 600
# 实例可接受的内存大小列表，单位GiB，请使用常见内存大小，如 [8, 16]
mem_choices = []
# 实例可接受的vCPU数量，请使用与实例内存比满足1:2、1:4、1:8的数值，如 [4, 8]
cpu_core_count_choices = []

[monitors.best_ecs_candidate.filters]
# 实例最大可接受的交易价格，单位CNY。超过此价格的实例会被过滤
max_trade_price = 0.6
# 正则表达式，表示对实例规格名（实例类型）的筛选，符合该正则表达式的实例会被过滤，例如 ^ecs\\.(e|s6|xn4|n4|mn4|e4|t|d).*$
instance_type_exclusion = ''

[samplers]
[samplers.player_count]
# 内存中最多存储的数据点数量
max_data_points = 100
# 采样间隔（秒）
sample_interval_sec = 5

[samplers.balance]
# 内存中最多存储的数据点数量
max_data_points = 100
# 采样间隔（秒）
sample_interval_sec = 300

[samplers.system_metrics]
# 实例CPU与内存占用采样间隔（秒）
sample_interval_sec = 60

[forum]
# 上传文件根目录；留空表示 $STATE_DIR/state/forum/uploads
upload_dir = ''
# 正文图片上传的最大字节数
max_upload_bytes = 10485760
# 头像上传的最大字节数
max_avatar_bytes = 2097152
# 主页背景上传的最大字节数
max_background_bytes = 8388608
# 主题正文 HTML 的最大字节数
max_thread_html_bytes = 131072
# 跟帖正文 HTML 的最大字节数
max_reply_html_bytes = 65536
# 单张图片允许的最大总像素数
max_image_pixels = 24000000
# 单篇正文允许的最大图片数
max_images_per_post = 20
# 单篇正文允许的最大提及数
max_mentions_per_post = 20
# 单篇主题允许的最大标签数；0 表示不限制
max_tags_per_post = 20
# 单篇正文允许的最大楼层引用数；0 表示不限制
max_quote_refs_per_post = 20
# 点赞通知抑制窗口（分钟）；0 表示不抑制
like_notification_cooldown_minutes = 10
# 每个用户上传文件占用的磁盘上限（字节）；0 表示不限制
user_quota_bytes = 268435456

[forum.rate_limit]
# 是否启用论坛接口限流
enabled = true
# 登录：每分钟每 IP+用户名的请求数
login_per_minute = 5
# 登录：每分钟每 IP 的总请求数，防止跨用户名爆破
login_ip_per_minute = 30
# 发主题：每分钟每用户的请求数
thread_per_minute = 10
# 编辑主题/跟帖：每分钟每用户的请求数
edit_per_minute = 20
# 发跟帖：每分钟每用户的请求数
reply_per_minute = 20
# 上传：每分钟每用户的请求数
upload_per_minute = 20
# 点赞/关注：每分钟每用户的请求数
like_per_minute = 60
# 提及候选搜索：每分钟每用户的请求数
mention_search_per_minute = 60
# 全文搜索：每分钟每用户（游客按 IP）的请求数
search_per_minute = 30
# 后台写操作：每分钟每用户的请求数
admin_write_per_minute = 60
