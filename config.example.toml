[base]
# HTTP服务器的监听端口
expose = 45678

[base.cors]
# 允许的源地址
allow_origins = ['*']
# 允许的请求方法
allow_methods = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
# 允许的请求头
allow_headers = ['Content-Length', 'Content-Type', 'Authorization', 'Last-Event-Id']
# 是否允许携带凭证信息
allow_credentials = true

[base.autotls]
# 是否启用
enabled = false
# 签发域名
domains = []

[base.session]
# 密钥对列表，支持密钥轮换
# 第一个密钥对用于新session，后续密钥对用于验证旧session
[[base.session.key_pairs]]
# 认证密钥（必需）
auth_key = 'your-authentication-key-here'
# 加密密钥（可选）
enc_key = 'your-encryption-key-here'

# 示例：密钥轮换配置（可选）
# [[base.session.key_pairs]]
# auth_key = 'new-auth-key-2024'
# enc_key = 'new-enc-key-2024'
# 
# [[base.session.key_pairs]]
# auth_key = 'old-auth-key-2023'
# enc_key = 'old-enc-key-2023'

[store]
# 数据库驱动类型
driver = ''
# 数据库主机地址
host = ''
# 数据库端口
port = 0
# 数据库用户名
user = ''
# 数据库密码
password = ''
# 数据库名称
dbname = ''
# 数据库字符集
charset = ''
# SSL模式
sslmode = ''
# SQLite数据库文件路径
path = ''
