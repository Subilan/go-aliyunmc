name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: make test

      - name: Package public release
        run: bash deploy/package-public.sh dist

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: go-aliyunmc
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  notify-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: default
    env:
      DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
    steps:
      - name: Notify production repo
        if: env.DEPLOY_PAT != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DEPLOY_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/seatidemc/production/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"ref\":\"${GITHUB_SHA}\"}}"
