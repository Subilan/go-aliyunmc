name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      GO_ALIYUNMC_TEST_MYSQL_USER: root
      GO_ALIYUNMC_TEST_MYSQL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: make test

      - name: Validate release scripts
        run: bash -n release/bundle.sh release/remote-install.sh

      - name: Build release bundle
        run: make bundle OUT="$RUNNER_TEMP/bundle"

      - name: Check bundle contents
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/bundle/go-aliyunmc"
          test ! -e "$RUNNER_TEMP/bundle/assets"
          test -f "$RUNNER_TEMP/bundle/go-aliyunmc.service"
          test -f "$RUNNER_TEMP/bundle/remote-install.sh"
